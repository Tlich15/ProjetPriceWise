<div class="flights-container">
  <h2>Comparateur de vols</h2>
  
  <form [formGroup]="searchForm" (ngSubmit)="onSearch()" class="search-form">
    <div class="form-group">
      <label for="dateDepart">Date de départ</label>
      <input 
        type="date" 
        id="dateDepart" 
        formControlName="dateDepart" 
        class="form-control"
        [ngClass]="{'is-invalid': searchForm.get('dateDepart')?.touched && searchForm.get('dateDepart')?.invalid}"
      >
      <div class="invalid-feedback" *ngIf="searchForm.get('dateDepart')?.touched && searchForm.get('dateDepart')?.invalid">
        La date de départ est requise
      </div>
    </div>
    
    <div class="form-group">
      <label for="depart">Aéroport de départ (code IATA)</label>
      <input 
        type="text" 
        id="depart" 
        formControlName="depart" 
        class="form-control"
        placeholder="Ex: TUN"
        [ngClass]="{'is-invalid': searchForm.get('depart')?.touched && searchForm.get('depart')?.invalid}"
      >
      <div class="invalid-feedback" *ngIf="searchForm.get('depart')?.touched && searchForm.get('depart')?.invalid">
        L'aéroport de départ est requis
      </div>
    </div>
    
    <div class="form-group">
      <label for="arrivee">Aéroport d'arrivée (code IATA)</label>
      <input 
        type="text" 
        id="arrivee" 
        formControlName="arrivee" 
        class="form-control"
        placeholder="Ex: CDG"
        [ngClass]="{'is-invalid': searchForm.get('arrivee')?.touched && searchForm.get('arrivee')?.invalid}"
      >
      <div class="invalid-feedback" *ngIf="searchForm.get('arrivee')?.touched && searchForm.get('arrivee')?.invalid">
        L'aéroport d'arrivée est requis
      </div>
    </div>
    
    <button type="submit" class="btn btn-primary" [disabled]="loading">
      <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
      Rechercher
    </button>
  </form>
  
  <div class="results mt-4" *ngIf="searchPerformed">
    <div class="alert alert-danger" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
    
    <div *ngIf="flights.length > 0">
      <h3>Résultats de la recherche</h3>
      
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Compagnie</th>
            <th>Agence</th>
            <th>Prix</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let flight of flights" [ngClass]="getPriceClass(flight.Prix)">
            <td>{{ flight.Compagnie }}</td>
            <td>{{ flight.Agence }}</td>
            <td>{{ flight.Prix | currency:'EUR' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
